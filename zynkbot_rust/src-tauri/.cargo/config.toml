# Intentionally empty.
#
# The CUDA_PATH / CUDA_LIBRARY_PATH / CUDAFLAGS vars that used to live here in an
# [env] table now live in START_ZYNKBOT.sh and install.sh, next to the nvcc
# detection that decides whether to build --features cuda at all.
#
# A Cargo [env] table is not target-scoped — there is no [target.<triple>.env] —
# so those Linux values were applied on every platform. On Windows that pushed
# CUDA_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu and CUDAFLAGS="-Xcompiler -fPIC"
# into the MSVC build (cl.exe has no -fPIC), breaking the CUDA build there.
