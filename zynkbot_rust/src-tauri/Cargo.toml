[package]
name = "app"
version = "0.9.5-beta1"
description = "A local-first AI companion with persistent memory"
authors = ["ContainAI"]
license-file = "../../LICENSE"
repository = "https://github.com/MSkill1/zynkbot"
edition = "2021"
rust-version = "1.77.2"
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["cdylib", "rlib"]

[features]
# llama-cpp-2 has its own cuda feature and has to be forwarded explicitly. Candle
# and llama.cpp are separate compilation pipelines (Rust-native kernels vs
# llama.cpp's C++/CUDA core built through CMake), so enabling CUDA for Candle
# alone left the chat LLM on CPU — and because llama.cpp just builds CPU-only
# kernels in that case, the build still succeeded with nothing to indicate it.
# Note this is feature forwarding only: adding features = ["cuda"] to the
# llama-cpp-2 dependency itself would make CUDA mandatory for every build and
# break CPU-only installs, which have no nvcc for llama-cpp-sys-2's CMake step.
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda", "llama-cpp-2/cuda"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.6"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"

# HTTP client for Flask backend communication, OpenAI API, and model downloads
reqwest = { version = "0.12", features = ["json", "blocking", "stream", "rustls-tls", "multipart"] }
futures = "0.3"  # Stream processing for SSE token streaming

# Environment variable loading
dotenv = "0.15"

# Async runtime (needed for reqwest)
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Directory walking for knowledge base
walkdir = "2"

# Utilities
once_cell = "1.20"
lazy_static = "1.4"
anyhow = "1.0"
dirs = "5.0"  # User directories for model cache
sha2 = "0.10"  # SHA-256 hashing for content-based sync comparison
hmac = "0.12"   # HMAC-SHA256 for AWS Sig V4 signing (R2 backup)
aes-gcm = "0.10" # AES-256-GCM encryption for cloud backup
hex = "0.4"     # Hex encode/decode for backup key and signatures
argon2 = "0.5"  # Argon2id passphrase-derived backup key

# Database (SQLite)
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "sqlite", "chrono", "uuid", "json"] }

# Regex for PHI detection (HIPAA mode)
regex = "1.10"

# PDF text extraction for Knowledge Base
pdf-extract = "0.7"

# Web search (HTML parsing)
scraper = "0.20"
urlencoding = "2.1"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# ZynkSync - Manual device management and synchronization
hostname = "0.4"
uuid = { version = "1.0", features = ["v4"] }
rand = "0.8"
axum = "0.7"  # HTTP server for receiving sync requests
tower = "0.4"  # Middleware for axum
tokio-rustls = "0.26"  # TLS for ZynkSync/ZynkLink/ZChat
rustls-pemfile = "2"   # Parse PEM cert/key for rustls
rcgen = "0.13"         # Self-signed TLS certificate generation
base64 = "0.22"        # Cert DER encoding for pairing exchange
hyper = { version = "1", features = ["http1", "server"] }  # Per-connection serving for HTTPS
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }  # TokioIo/TokioExecutor

# ZynkLink - File watching and P2P sync (temporarily disabled due to build issues on Linux)
# notify = "7.0"
# webrtc = "0.11"

# Whisper - Temporarily disabled due to GGML symbol conflicts with llama-cpp-2
# Both whisper.cpp and llama.cpp include GGML, causing duplicate symbols during linking
# Re-enable when: (1) whisper.cpp/llama.cpp resolve GGML conflicts, or (2) use dynamic linking
# whisper-rs = { version = "0.12", features = ["whisper-cpp-log"] }
# hound = "3.5"        # WAV file handling
# tempfile = "3.8"     # Temporary audio files

# Candle ML stack - BERT NER, embeddings, safety classifier
# Requires +fullfp16 rustflag on aarch64-linux-android (set in .cargo/config.toml)
# Targets ARMv8.2-A+ (Snapdragon 730+, Dimensity 700+, all ~2018+ phones)
candle-core = { git = "https://github.com/huggingface/candle.git", rev = "1dd2d2c70a41d2969f13d5aa5c512251dc353773" }
candle-nn = { git = "https://github.com/huggingface/candle.git", rev = "1dd2d2c70a41d2969f13d5aa5c512251dc353773" }
candle-transformers = { git = "https://github.com/huggingface/candle.git", rev = "1dd2d2c70a41d2969f13d5aa5c512251dc353773" }
hf-hub = "0.4"
tokenizers = { version = "0.20", default-features = false, features = ["onig", "progressbar"] }
ndarray = "0.16"

# Local LLM inference (GGUF models) - desktop only; Android uses API backends (Phase 2)
[target.'cfg(not(target_os = "android"))'.dependencies]
llama-cpp-2 = "0.1"
# Cross-platform mic capture, bypassing WebView getUserMedia (broken on Linux Tauri).
cpal = "0.15"

# Offline dictation (Vosk) - Linux desktop; libvosk.so is bundled in lib/vosk.
# Android uses vosk-android AAR via Kotlin bridge (not this crate).
# macOS: libvosk.dylib not bundled; dictation falls back to OpenAI or browser.
[target.'cfg(target_os = "linux")'.dependencies]
vosk = "0.3"

# Offline dictation (Vosk) - Windows desktop. libvosk.lib/.dll are NOT committed
# (~66 MB); install.bat downloads the Windows SDK into lib/vosk. Kept as its own
# target section rather than widening the Linux cfg so Linux resolution is unchanged.
[target.'cfg(target_os = "windows")'.dependencies]
vosk = "0.3"

# Debug builds (`tauri android build -- --debug`) are needed for run-as/debugging on
# device, but Rust's dev profile leaves the ML inference in our dependencies
# (candle BERT embeddings, the toxicity classifier, tokenizers, sqlx) unoptimized:
# measured on the OnePlus 2026-09-03, that turned a 0.85s Mistral reply into a
# 14s hands-free answer (embedding 5.0s, safety check 4.4s, db 3.8s — all local).
# Optimize ONLY the crates that hold the slow kernels (ML inference, tokenizing,
# SQLite). A blanket `package."*"` override was tried first and broke the build:
# it changed openssl-sys's cache key, forcing a from-scratch vendored OpenSSL
# build, which on this machine fails at `make install_dev` (exit 127, empty
# LIBDIR from util/mkinstallvars.pl). The cached July-14 OpenSSL is what links.
# Listing packages explicitly leaves openssl-sys (and everything else) untouched.
# Names taken from `cargo tree`, 2026-09-03.
[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-nn]
opt-level = 3
[profile.dev.package.candle-transformers]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.gemm-f16]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
[profile.dev.package.gemm-f64]
opt-level = 3
[profile.dev.package.gemm-c32]
opt-level = 3
[profile.dev.package.gemm-c64]
opt-level = 3
[profile.dev.package.half]
opt-level = 3
[profile.dev.package.matrixmultiply]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3
[profile.dev.package.rayon]
opt-level = 3
[profile.dev.package.rayon-core]
opt-level = 3
[profile.dev.package.safetensors]
opt-level = 3
[profile.dev.package.tokenizers]
opt-level = 3
[profile.dev.package.sqlx-core]
opt-level = 3
[profile.dev.package.sqlx-sqlite]
opt-level = 3
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
# Matches the version Tauri's Android layer already pulls in (see Cargo.lock) so
# there is a single jni in the tree. Used by android_jni.rs for the ZynkCore door.
jni = "0.21"
