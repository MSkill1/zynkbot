name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: ''
          - platform: windows-latest
            args: ''
          # macOS — uncomment to add:
          # - platform: macos-latest
          #   args: '--target aarch64-apple-darwin'  # Apple Silicon
          # - platform: macos-latest
          #   args: '--target x86_64-apple-darwin'   # Intel

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: zynkbot_rust/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        # macOS cross-compile targets — uncomment if adding macOS runners:
        # with:
        #   targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: zynkbot_rust/src-tauri -> target

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libayatana-appindicator3-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Install frontend dependencies
        working-directory: zynkbot_rust
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: zynkbot_rust
          tagName: ${{ github.ref_name }}
          releaseName: Zynkbot ${{ github.ref_name }}
          releaseBody: |
            See the [CHANGELOG](https://github.com/MSkill1/zynkbot/blob/main/CHANGELOG.md) for details.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          args: ${{ matrix.args }}

  release-android:
    permissions:
      contents: write
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34'

      - name: Install Android NDK and build tools
        run: |
          sdkmanager "ndk;27.0.12077973" "build-tools;36.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: zynkbot_rust/package-lock.json

      - name: Setup Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: zynkbot_rust/src-tauri -> target

      - name: Install system dependencies
        run: sudo apt-get install -y libssl-dev perl

      - name: Write signing keystore
        run: |
          mkdir -p $HOME/keystores
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode \
            > $HOME/keystores/zynkbot-release.jks
          printf "storeFile=$HOME/keystores/zynkbot-release.jks\nstorePassword=${{ secrets.ANDROID_STORE_PASSWORD }}\nkeyAlias=${{ secrets.ANDROID_KEY_ALIAS }}\nkeyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}\n" \
            > zynkbot_rust/src-tauri/gen/android/keystore.properties

      - name: Install frontend dependencies
        working-directory: zynkbot_rust
        run: npm ci

      - name: Build Android APK
        working-directory: zynkbot_rust
        run: npm run tauri android build -- --apk

      - name: Upload APK to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./zynkbot_rust/src-tauri/tauri.conf.json').version")
          cp zynkbot_rust/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
            Zynkbot_${VERSION}.apk
          gh release upload ${{ github.ref_name }} Zynkbot_${VERSION}.apk \
            --repo MSkill1/zynkbot --clobber
