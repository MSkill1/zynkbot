name: Tests

on:
  push:
    branches: ['**']
    # Documentation-only pushes have nothing to test.
    paths-ignore:
      - 'docs/**'
      - 'labs/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast job: source-level contract guards plus frontend linting.
  # Needs no ML assets, so it gives a signal in a couple of minutes.
  guards:
    name: Contract guards + lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: zynkbot_rust/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: zynkbot_rust/src-tauri -> target

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libayatana-appindicator3-dev \
            build-essential \
            curl \
            wget \
            file \
            libasound2-dev

      - name: Install frontend dependencies
        working-directory: zynkbot_rust
        run: npm ci

      # Verifies the Tauri command wire contract: no underscore-prefixed command
      # parameters, and every frontend invoke() resolves to a registered command.
      # See src-tauri/tests/command_contract.rs for why this exists.
      - name: Tauri command contract guards
        working-directory: zynkbot_rust/src-tauri
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/zynkbot_rust/src-tauri/lib/vosk
        run: cargo test --test command_contract -- --nocapture

      - name: ESLint
        working-directory: zynkbot_rust
        run: npx eslint src --ext .js,.jsx --max-warnings=0

      # The frontend unit tests (voice command parsing, native-turn merging, speech
      # cleanup, ...) were only ever run by hand until 2026-09-17.
      - name: Frontend unit tests
        working-directory: zynkbot_rust
        env:
          CI: 'true'
        run: npx react-scripts test --watchAll=false

  # Full unit suite. Several tests load the bundled ML models, which are not
  # committed to the repo, so they are fetched here the same way install.sh does.
  unit-tests:
    name: Rust unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: zynkbot_rust/src-tauri -> target

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libayatana-appindicator3-dev \
            build-essential \
            curl \
            wget \
            file \
            libasound2-dev

      # ~200 MB of safetensors; cached so it is downloaded once per model set.
      - name: Cache system models
        id: models-cache
        uses: actions/cache@v4
        with:
          path: zynkbot_rust/src-tauri/models/system
          key: system-models-minilm-toxicbert-bertner-v1

      - name: Download system models
        if: steps.models-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SYSTEM_MODELS_DIR="zynkbot_rust/src-tauri/models/system"
          download_hf_model() {
            local repo="$1"; local target_dir="$2"; local files=("${@:3}")
            mkdir -p "$target_dir"
            for file in "${files[@]}"; do
              echo "Downloading $repo/$file"
              wget -q -O "$target_dir/$file" \
                "https://huggingface.co/$repo/resolve/main/$file"
            done
          }
          download_hf_model "sentence-transformers/all-MiniLM-L6-v2" \
            "$SYSTEM_MODELS_DIR/all-MiniLM-L6-v2" \
            config.json tokenizer.json model.safetensors
          download_hf_model "unitary/toxic-bert" \
            "$SYSTEM_MODELS_DIR/toxic-bert" \
            config.json vocab.txt model.safetensors
          download_hf_model "dslim/bert-base-NER" \
            "$SYSTEM_MODELS_DIR/bert-base-NER" \
            config.json vocab.txt model.safetensors

      # libvosk.so is committed under src-tauri/lib/vosk, but build.rs only sets the
      # *link* path. The test binary needs it on the runtime loader path too, or it
      # exits 127 before a single test runs.
      - name: Run unit tests
        working-directory: zynkbot_rust/src-tauri
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/zynkbot_rust/src-tauri/lib/vosk
        run: cargo test --lib

  # Compiles the Rust library for Android. Desktop jobs never build the
  # #[cfg(target_os = "android")] branches, so an Android-only break is invisible
  # until someone runs a full APK build by hand. That is exactly how main shipped
  # call sites for with_cached_session/resolve_default_model_path without the
  # matching Android stubs in llm/mod.rs, breaking the APK build.
  #
  # cargo check rather than a full APK build: it catches the compile errors this is
  # meant to catch, in a fraction of the time, without signing or Gradle.
  android-check:
    name: Android compile check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: zynkbot_rust/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34'

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Setup Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: zynkbot_rust/src-tauri -> target
          key: android-check

      # cargo-ndk supplies the CC/AR/linker environment the NDK needs. Without it
      # the build scripts for ring, aws-lc-sys and openssl-sys fail before any of
      # our own code is reached.
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # tauri-build expects the frontend output directory to exist, so the web
      # assets are built even though this job only type-checks Rust.
      - name: Build frontend
        working-directory: zynkbot_rust
        run: |
          npm ci
          npm run build

      - name: Check aarch64 (arm64-v8a)
        working-directory: zynkbot_rust/src-tauri
        run: cargo ndk -t arm64-v8a check --lib

      - name: Check armv7 (armeabi-v7a)
        working-directory: zynkbot_rust/src-tauri
        run: cargo ndk -t armeabi-v7a check --lib

  # Compiles the hand-written Kotlin. Nothing above does: the Rust check never runs
  # Gradle, so a Kotlin error was only found by a full release build, twenty minutes
  # into a tag (2026-09-17). The only way to compile the Kotlin is an APK build, so
  # this job builds an UNSIGNED DEBUG APK inside the runner and throws it away: no
  # artifact, no release, no signing key. It runs only when Kotlin or the manifest
  # changed (or on a manual run), so ordinary pushes are not slowed by it.
  kotlin-check:
    name: Android Kotlin compile check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did Kotlin or the manifest change?
        id: kt
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then base="$(git rev-parse HEAD~1 2>/dev/null || echo "")"; fi
          if [ -z "$base" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$base" "${{ github.sha }}" | grep -qE '\.kt$|AndroidManifest\.xml$|build\.gradle\.kts$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "No Kotlin/manifest/Gradle change — skipping the APK compile."
          fi

      - name: Setup Java 17
        if: steps.kt.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        if: steps.kt.outputs.changed == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install Android NDK
        if: steps.kt.outputs.changed == 'true'
        run: |
          sdkmanager "ndk;30.0.15729638"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/30.0.15729638" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/30.0.15729638" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/ndk/30.0.15729638/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Setup Node
        if: steps.kt.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: zynkbot_rust/package-lock.json

      - name: Setup Rust with Android target
        if: steps.kt.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        if: steps.kt.outputs.changed == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: zynkbot_rust/src-tauri -> target
          key: android-kotlin-check

      - name: Install system dependencies
        if: steps.kt.outputs.changed == 'true'
        run: sudo apt-get install -y libssl-dev perl

      # app/build.gradle.kts insists on keystore.properties even for a debug build
      # (it configures the release signing block unconditionally). A throwaway
      # keystore satisfies it; the real key is never used here.
      - name: Write a throwaway keystore
        if: steps.kt.outputs.changed == 'true'
        run: |
          keytool -genkeypair -noprompt -keystore /tmp/ci-throwaway.jks -storepass citest1 -keypass citest1 \
            -alias ci -keyalg RSA -keysize 2048 -validity 1 -dname "CN=ci-throwaway"
          printf "storeFile=/tmp/ci-throwaway.jks\nstorePassword=citest1\nkeyAlias=ci\nkeyPassword=citest1\n" \
            > zynkbot_rust/src-tauri/gen/android/keystore.properties

      - name: Install frontend dependencies
        if: steps.kt.outputs.changed == 'true'
        working-directory: zynkbot_rust
        run: npm ci

      - name: Build a debug APK (compile check only; discarded)
        if: steps.kt.outputs.changed == 'true'
        working-directory: zynkbot_rust
        run: npm run tauri android build -- --debug --apk --target aarch64
